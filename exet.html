  <script>
    // Global error handler for loading errors
    let errorCount = 0;
    const MAX_ERRORS_TO_DISPLAY = 5;

    function displayError(message, source, lineno, colno, error) {
      errorCount++;
      const loadingDiv = document.getElementById('xet-loading');
      if (!loadingDiv) return;

      // Update the loading div to show error information
      if (errorCount === 1) {
        loadingDiv.innerHTML = '<div style="text-align:left;font-family:monospace;padding:20px;max-width:800px;margin:0 auto;">' +
          '<h3 style="color:#d00;">⚠️ Loading Error Detected</h3>' +
          '<p>An error occurred while loading the application. Details below:</p>' +
          '<div id="error-details" style="background:#f5f5f5;padding:10px;border-left:3px solid #d00;margin:10px 0;"></div>' +
          '<div id="debug-info" style="background:#f9f9f9;padding:10px;margin-top:20px;font-size:0.9em;"></div>' +
          '</div>';
      }

      const errorDetails = document.getElementById('error-details');
      const debugInfo = document.getElementById('debug-info');

      if (errorDetails && errorCount <= MAX_ERRORS_TO_DISPLAY) {
        let errorHtml = `<div style="margin-bottom:15px;padding:10px;background:white;">`;
        errorHtml += `<strong>Error ${errorCount}:</strong> ${message}<br>`;

        if (error && error.stack) {
          errorHtml += `<details style="margin-top:5px;">`;
          errorHtml += `<summary style="cursor:pointer;color:#666;">Stack trace</summary>`;
          errorHtml += `<pre style="overflow-x:auto;font-size:0.85em;margin-top:5px;">${error.stack}</pre>`;
          errorHtml += `</details>`;
        } else if (source) {
          errorHtml += `<small style="color:#666;">Source: ${source}:${lineno}:${colno}</small>`;
        }

        errorHtml += `</div>`;
        errorDetails.innerHTML += errorHtml;
      }

      if (debugInfo) {
        // Add debug information about the environment
        let info = '<strong>Debug Information:</strong><br>';
        info += `User Agent: ${navigator.userAgent}<br>`;
        info += `Platform: ${navigator.platform}<br>`;
        info += `Memory (if available): ${navigator.deviceMemory || 'N/A'} GB<br>`;
        info += `Hardware Concurrency: ${navigator.hardwareConcurrency || 'N/A'} cores<br>`;
        info += `Max Touch Points: ${navigator.maxTouchPoints || 'N/A'}<br>`;
        info += `Screen: ${screen.width}x${screen.height}<br>`;
        info += `Available Screen: ${screen.availWidth}x${screen.availHeight}<br>`;
        info += `Color Depth: ${screen.colorDepth} bits<br>`;
        info += `Timestamp: ${new Date().toISOString()}<br>`;

        // Check if exetLexicon is loaded
        info += `<br><strong>Lexicon Status:</strong><br>`;
        info += `exetLexicon defined: ${typeof exetLexicon !== 'undefined'}<br>`;
        if (typeof exetLexicon !== 'undefined') {
          info += `exetLexicon.lexicon exists: ${!!(exetLexicon && exetLexicon.lexicon)}<br>`;
          if (exetLexicon && exetLexicon.lexicon) {
            info += `Lexicon entries: ${exetLexicon.lexicon.length || 'unknown'}<br>`;
          }
        }

        debugInfo.innerHTML = info;
      }

      // Log to console as well
      console.error('Exet Loading Error:', { message, source, lineno, colno, error });

      return true; // Prevent default browser error handling
    }

    // Capture all errors
    window.addEventListener('error', function (event) {
      displayError(
        event.message || 'Unknown error',
        event.filename,
        event.lineno,
        event.colno,
        event.error
      );
    });

    // Capture unhandled promise rejections
    window.addEventListener('unhandledrejection', function (event) {
      displayError(
        `Unhandled Promise Rejection: ${event.reason}`,
        '',
        0,
        0,
        event.reason
      );
    });
  </script>
